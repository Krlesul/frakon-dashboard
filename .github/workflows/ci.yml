name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m compileall -q custom_components/frakon_dashboard
      - run: python scripts/verify_responsive_write_lock.py
      - run: python scripts/verify_alpha_release_readiness.py
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: python scripts/build_hacs_release.py
      - run: python scripts/verify_hacs_release.py
      - name: Simulate Home Assistant install
        run: |
          rm -rf /tmp/frakon-ha-config
          mkdir -p /tmp/frakon-ha-config
          unzip -q dist/frakon_dashboard.zip -d /tmp/frakon-ha-config
          python scripts/verify_home_assistant_install.py /tmp/frakon-ha-config
      - uses: actions/upload-artifact@v7
        with:
          name: frakon-dashboard
          path: |
            dist/frakon-dashboard.js
            dist/frakon_dashboard.zip
